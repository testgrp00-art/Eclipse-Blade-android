plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nitaistudio.eclipseblade'
    compileSdk 36

    defaultConfig {
        applicationId "com.nitaistudio.eclipseblade"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // No signing config on purpose: bundleRelease produces an UNSIGNED .aab
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
